name: Daily Job Search

on:
  schedule:
    # 11:00 UTC = 7:00am ET (adjust if you want a different time)
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run job finder
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python job_finder.py

      - name: Commit updated data
        run: |
          git config user.name "job-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/jobs.json seen_job_ids.json
          git diff --cached --quiet || git commit -m "Update job matches $(date -u +%Y-%m-%d)"
          git push
